<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator AI Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <aside class="sidebar">
        <h2>Creovate<span class="highlight">AI</span></h2>
        <ul>
            <li class="active">Dashboard</li>
            <li>Settings</li>
        </ul>
    </aside>

    <main class="main">
        <header class="header">
            <div>
                <h1>Create AI Video</h1>
                <p class="subtitle">Turn your ideas into professional avatar videos.</p>
            </div>
      
        </header>

    

        <div class="grid-layout">
            
            <div class="input-section">
                
                <div class="card">
                    <h2>1. Enter Idea</h2>
                    <textarea id="ideaInput" aria-label="Enter your video idea" placeholder="E.g., A short video explaining the benefits of artificial intelligence..."></textarea>

                    <div class="row">
                        <select id="tone" aria-label="Select video tone">
                            <option value="Educational">Educational</option>
                            <option value="Casual">Casual</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                        <select id="language" aria-label="Select spoken language">
                            <option value="English">English</option>
                            <option value="Tamil">Tamil</option>
                        </select>
                        <select id="duration" aria-label="Select video duration">
                            <option value="30">30 Seconds</option>
                            <option value="60">60 Seconds</option>
                        </select>
                    </div>
                    <button id="generateScriptBtn" class="primary-btn" onclick="generateScript()">Generate Script</button>
                </div>

                <div class="card">
                    <h2>2. Choose Your Avatar</h2>
                    <p class="subtitle spacing-bottom">Upload a face image or use your camera.</p>
                    
                    <div class="row">
                        <button id="startCameraBtn" class="secondary-btn" onclick="startCamera()">📷 Use Camera</button>
                        <input type="file" id="imageUpload" class="file-input" accept="image/*" aria-label="Upload avatar image">
                    </div>

                    <div id="cameraContainer" class="hidden-preview-container">
                        <video id="webcam" autoplay playsinline></video>
                        <button id="captureBtn" class="primary-btn spacing-top" onclick="capturePhoto()">📸 Capture Photo</button>
                        <canvas id="canvas" class="hidden-element"></canvas>
                    </div>

                    <div id="avatarPreviewContainer" class="hidden-preview-container">
                        <img id="avatarPreview" src="" alt="Avatar Preview">
                        <p class="subtitle success-text">Avatar Ready!</p>
                    </div>
                </div>

                <div class="card">
                    <h2>3. Script Output</h2>
                    <textarea id="scriptOutput" aria-label="Generated script output" placeholder="Your generated script will appear here..."></textarea>
                    <button id="generateVideoBtn" class="primary-btn" onclick="generateVideo()">Generate Avatar Video</button>
                </div>
            </div>

            <div class="output-section">
                <div class="card video-card">
                    <h2>4. Video Output</h2>
                    <div id="videoPreview" class="video-box">
                        <p class="placeholder-text">No video generated yet</p>
                    </div>
                    <button id="downloadBtn" class="secondary-btn" disabled>Download MP4</button>
                </div>
            </div>

        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
