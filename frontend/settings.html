<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | Creovate Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark:#0B0F19; --bg-light:#f8fafc;
  --card-dark:#131B2C; --card-light:#ffffff;
  --text-dark:#f8fafc; --text-light:#0f172a;
  --accent:#6366f1;
  --border-dark:rgba(255,255,255,0.1); --border-light:rgba(0,0,0,0.1);
}
body { margin:0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-dark); color: var(--text-dark); transition: all 0.3s ease; padding: 40px; }
body.light-mode { background: var(--bg-light); color: var(--text-light); }
.settings-container { max-width: 600px; margin: auto; }
.card { background: var(--card-dark); border: 1px solid var(--border-dark); padding: 30px; border-radius: 12px; margin-bottom: 20px; transition: 0.3s; }
body.light-mode .card { background: var(--card-light); border: 1px solid var(--border-light); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
.profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
#avatarPreview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
.btn { padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
.toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-dark); }
body.light-mode .toggle-row { border-bottom-color: var(--border-light); }
.toggle-row:last-child { border-bottom: none; }
.switch { position: relative; display: inline-block; width: 50px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--accent); }
input:checked + .slider:before { transform: translateX(24px); }
.nav-back { color: var(--accent); text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: 600; }
.nav-back:hover { text-decoration: underline; }
</style>
<script>
    if(localStorage.getItem('creovate_theme') === 'light') document.documentElement.classList.add('light-mode');
</script>
</head>
<body class="theme-body">

<div class="settings-container">
    <a href="dashboard.html" class="nav-back">← Back to Studio Dashboard</a>
    
    <div class="card">
        <h2>Profile Settings</h2>
        <div class="profile-header">
            <img id="avatarPreview" src="">
            <div>
                <h3 id="userNameDisplay">Loading...</h3>
                <p id="userEmailDisplay" style="color: #94a3b8; font-size: 0.9rem;">Connecting to Firebase...</p>
                <div style="margin-top: 10px;">
                    <button class="btn" id="changeBtn">Change Avatar</button>
                    <input type="file" id="fileInput" style="display: none;" accept="image/*">
                    <button class="btn" id="removeBtn" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; margin-left: 10px;">Remove</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>App Preferences</h2>
        <div class="toggle-row">
            <span>🌙 Dark Mode</span>
            <label class="switch">
                <input type="checkbox" id="darkToggle">
                <span class="slider"></span>
            </label>
        </div>
        <button class="btn" id="logoutBtn" style="background: #ef4444; width: 100%; margin-top: 20px;">Log Out of Creovate</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 REPLACE WITH YOUR FIREBASE CONFIG 🔴
         const firebaseConfig = {
  apiKey: "AIzaSyDqOPA5Lul3NQJofyJvUQBFZb5DAPry7UM",
  authDomain: "creovate-101.firebaseapp.com",
  projectId: "creovate-101",
  storageBucket: "creovate-101.firebasestorage.app",
  messagingSenderId: "479670114683",
  appId: "1:479670114683:web:0d5fab68e95294a94445de",
  measurementId: "G-X2VWJZQEK5"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // 1. Get Logged in User from LocalStorage (set by your login.html)
    const userStr = localStorage.getItem('currentUser');
    if (!userStr) {
        window.location.href = "login.html";
    }
    const user = JSON.parse(userStr);
    const userEmail = user.email;
    const userDocRef = doc(db, "users", userEmail);

    const initProfile = async () => {
        try {
            const userDoc = await getDoc(userDocRef);
            let data = {};
            
            if (userDoc.exists()) {
                data = userDoc.data();
            } else {
                // First time user views settings: Create the user doc in Firestore
                data = { name: user.name, email: user.email, theme: "dark", plan: "Premium Plan" };
                await setDoc(userDocRef, data);
            }
            
            document.getElementById('userNameDisplay').innerText = data.name || user.name;
            document.getElementById('userEmailDisplay').innerText = data.email || user.email;

            const preview = document.getElementById('avatarPreview');
            const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(data.name || user.name)}&background=6366f1&color=fff`;
            preview.src = data.avatar || defaultAvatar;

            // Sync Toggle Switch with Database State
            const darkToggle = document.getElementById('darkToggle');
            const body = document.querySelector('.theme-body');
            const root = document.documentElement;
            
            darkToggle.checked = data.theme !== 'light';
            if(!darkToggle.checked) {
                body.classList.add('light-mode');
                root.classList.add('light-mode');
            }
        } catch (error) {
            console.error("Firebase Error:", error);
            document.getElementById('userEmailDisplay').innerText = "Database Offline";
        }
    };
    initProfile();

    // 2. Change & Save Avatar to Firestore
    document.getElementById('changeBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').addEventListener('change', function() {
        if(!this.files[0]) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const base64 = e.target.result;
            document.getElementById('avatarPreview').src = base64;
            
            // Save base64 string directly to Firebase Database
            await updateDoc(userDocRef, { avatar: base64 }); 
        };
        reader.readAsDataURL(this.files[0]);
    });

    // 3. Remove Avatar
    document.getElementById('removeBtn').onclick = async () => {
        const name = document.getElementById('userNameDisplay').innerText;
        document.getElementById('avatarPreview').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=6366f1&color=fff`;
        await updateDoc(userDocRef, { avatar: "" });
    };

    // 4. Save Theme Toggle to Firestore
    document.getElementById('darkToggle').addEventListener('change', async (e) => {
        const isDark = e.target.checked;
        const newTheme = isDark ? 'dark' : 'light';
        const body = document.querySelector('.theme-body');
        const root = document.documentElement;
        
        if (isDark) {
            body.classList.remove('light-mode');
            root.classList.remove('light-mode');
        } else {
            body.classList.add('light-mode');
            root.classList.add('light-mode');
        }

        // Backup in LocalStorage for instant non-flickering loading on Dashboard
        localStorage.setItem('creovate_theme', newTheme);

        // Sync Update with Firebase Database
        await updateDoc(userDocRef, { theme: newTheme });
    });

    // 5. Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
        // Clears the session created by login.html
        localStorage.removeItem('currentUser');
        localStorage.removeItem('creovate_theme');
        window.location.href = "login.html";
    });
</script>
</body>
</html>
