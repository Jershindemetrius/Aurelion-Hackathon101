<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium User Profile Settings</title>

<style>
:root{
  --bg-dark:#020617;
  --bg-light:#f1f5f9;
  --card-dark:rgba(255,255,255,0.06);
  --card-light:rgba(0,0,0,0.05);
  --text-dark:#e5e7eb;
  --text-light:#0f172a;
  --accent:#6366f1;
  --border:rgba(255,255,255,0.12);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at top,#1e293b,#020617);
  color:var(--text-dark);
  transition:all .35s ease;
}

/* LIGHT MODE */
body.light{
  background:var(--bg-light);
  color:var(--text-light);
}

/* HIGH CONTRAST */
body.high-contrast{
  background:#000 !important;
  color:#fff !important;
}

/* FOCUS MODE */
body.focus-mode .hide-in-focus{
  display:none !important;
}

.container{
  max-width:1000px;
  margin:40px auto;
  padding:20px;
}

.profile-card{
  background:var(--card-dark);
  border:1px solid var(--border);
  border-radius:26px;
  padding:30px;
  backdrop-filter:blur(20px);
  box-shadow:0 25px 80px rgba(0,0,0,.45);
  transition:.3s;
}

body.light .profile-card{
  background:var(--card-light);
}

.title{
  font-size:26px;
  font-weight:700;
  margin-bottom:20px;
}

.profile-header{
  display:flex;
  gap:28px;
  flex-wrap:wrap;
  align-items:center;
}

/* AVATAR */
.avatar-wrapper{
  position:relative;
  width:130px;
  height:130px;
  border-radius:50%;
  padding:4px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6,#22d3ee);
}

.avatar-img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:#111827;
}

.avatar-actions{
  margin-top:12px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  padding:9px 16px;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  background:rgba(255,255,255,0.08);
  color:inherit;
  transition:.25s;
}

.btn:hover{
  background:var(--accent);
  color:#fff;
  transform:translateY(-1px);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
  margin-top:10px;
}

.input-group label{
  font-size:13px;
  opacity:.85;
  display:block;
  margin-bottom:6px;
}

.input-group input,
.input-group select{
  width:100%;
  padding:11px 13px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.05);
  color:inherit;
  outline:none;
}

.toggles{
  margin-top:28px;
  display:grid;
  gap:14px;
}

.toggle-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,0.04);
  padding:15px 18px;
  border-radius:16px;
  border:1px solid var(--border);
}

.switch{
  position:relative;
  width:48px;
  height:26px;
}

.switch input{display:none}

.slider{
  position:absolute;
  inset:0;
  background:#475569;
  border-radius:50px;
  cursor:pointer;
  transition:.25s;
}

.slider::before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.25s;
}

input:checked + .slider{
  background:var(--accent);
}

input:checked + .slider::before{
  transform:translateX(22px);
}

.hidden-input{display:none}
</style>
</head>

<body>

<div class="container">

  <div class="profile-card">
    <div class="title">👤 User Profile</div>

    <div class="profile-header">

      <div>
        <div class="avatar-wrapper">
          <img
            id="avatarPreview"
            class="avatar-img"
            src="https://ui-avatars.com/api/?name=Creator&background=6366f1&color=fff"
            alt="Profile"
          >
        </div>

        <div class="avatar-actions">
          <button class="btn" id="changeBtn">Change</button>
          <button class="btn" id="removeBtn">Remove</button>
          <input type="file" id="fileInput" class="hidden-input" accept="image/*">
        </div>
      </div>

      <div style="flex:1;min-width:240px;">
        <div class="form-grid">

          <div class="input-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">
          </div>

          <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="Enter email">
          </div>

          <div class="input-group">
            <label>Preferred Language</label>
            <select>
              <option>English</option>
              <option>Tamil</option>
              <option>Hindi</option>
            </select>
          </div>

        </div>
      </div>

    </div>

    <div class="toggles">

      <div class="toggle-row hide-in-focus">
        <span>🌙 Dark Mode</span>
        <label class="switch">
          <input type="checkbox" id="darkToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-row hide-in-focus">
        <span>⚡ High Contrast</span>
        <label class="switch">
          <input type="checkbox" id="contrastToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span>🎯 Focus Mode</span>
        <label class="switch">
          <input type="checkbox" id="focusToggle">
          <span class="slider"></span>
        </label>
      </div>

    </div>

  </div>
</div>

<script>
const fileInput=document.getElementById('fileInput');
const preview=document.getElementById('avatarPreview');

// change image
 document.getElementById('changeBtn').onclick=()=>fileInput.click();

fileInput.addEventListener('change',function(){
  const file=this.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>preview.src=e.target.result;
  reader.readAsDataURL(file);
});

// remove image
 document.getElementById('removeBtn').onclick=()=>{
  preview.src='https://ui-avatars.com/api/?name=Creator&background=6366f1&color=fff';
  fileInput.value='';
};

// dark mode
 document.getElementById('darkToggle').addEventListener('change',e=>{
  document.body.classList.toggle('light',!e.target.checked);
});

// contrast
 document.getElementById('contrastToggle').addEventListener('change',e=>{
  document.body.classList.toggle('high-contrast',e.target.checked);
});

// focus mode (REAL)
 document.getElementById('focusToggle').addEventListener('change',e=>{
  document.body.classList.toggle('focus-mode',e.target.checked);
});
</script>

</body>
</html>
