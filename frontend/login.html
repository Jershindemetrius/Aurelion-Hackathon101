<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Creovate AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* === RESET & BASE STYLES === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            overflow: hidden;
            position: relative;
        }

        /* === FLUID ANIMATED BACKGROUND === */
        .mesh-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            overflow: hidden;
        }

        .blob {
            position: absolute;
            filter: blur(90px);
            border-radius: 50%;
            animation: float 10s infinite ease-in-out alternate;
            opacity: 0.8;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: #ffb199;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 600px;
            height: 600px;
            background: #a18cd1;
            bottom: -200px;
            right: -100px;
            animation-delay: -3s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* === GLASSMORPHISM CARD === */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .header-text {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .logo {
            height: 48px;
            margin-bottom: 1rem;
            /* If the logo is dark/light, adjust accordingly */
        }

        .header-text h1 {
            color: #1e293b;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header-text p {
            color: #64748b;
            font-size: 0.95rem;
        }

        /* === FORM ELEMENTS === */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #334155;
            margin-left: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.9);
            color: #0f172a;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #8b5cf6;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        }

        .input-wrapper input::placeholder {
            color: #94a3b8;
        }

        .toggle-password {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
        }

        .toggle-password:hover {
            color: #8b5cf6;
        }

        /* === BUTTONS === */
        .btn {
            width: 100%;
            padding: 1rem;
            border-radius: 14px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
            margin: 0.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(148, 163, 184, 0.3);
        }

        .divider::before { margin-right: 1rem; }
        .divider::after { margin-left: 1rem; }

        .btn-google {
            background: rgba(255, 255, 255, 0.8);
            color: #334155;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .btn-google:hover {
            background: #ffffff;
            border-color: #cbd5e1;
        }

        .btn-google img {
            width: 20px;
            height: 20px;
        }

        /* === ALERTS & LINKS === */
        .footer-links {
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 1rem;
        }

        .footer-links a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .forgot-pass {
            text-align: right;
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }

        .forgot-pass a {
            color: #64748b;
            text-decoration: none;
        }

        #errorMessage {
            background: #fee2e2;
            color: #ef4444;
            padding: 0.8rem;
            border-radius: 10px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="login-card">
        <div class="header-text">
            <img src="Creovate.png" alt="CreovateAI" class="logo">
            <h1>Welcome back</h1>
            <p>Log in to manage your avatars and scripts</p>
        </div>

        <div id="errorMessage"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="creator@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="input-group" style="margin-top: 1rem;">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" id="togglePassword">Show</button>
                </div>
                <div class="forgot-pass">
                    <a href="#">Forgot password?</a>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="loginBtn">Sign in</button>
        </form>

        <div class="divider">or</div>

        <button type="button" class="btn btn-google" id="googleBtn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
            Continue with Google
        </button>

        <div class="footer-links">
            Don't have an account? <a href="register.html">Sign up for free</a>
        </div>
    </div>

<script type="module">
        // 1. Import Firebase Core and Firestore
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 2. YOUR FIREBASE CONFIG
        // (Copy this from your Firebase Project Settings)
       const firebaseConfig = {
  apiKey: "AIzaSyDqOPA5Lul3NQJofyJvUQBFZb5DAPry7UM",
  authDomain: "creovate-101.firebaseapp.com",
  projectId: "creovate-101",
  storageBucket: "creovate-101.firebasestorage.app",
  messagingSenderId: "479670114683",
  appId: "1:479670114683:web:0d5fab68e95294a94445de",
  measurementId: "G-X2VWJZQEK5"
};

        // 3. Initialize App and Database
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 4. UI Elements
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const googleBtn = document.getElementById('googleBtn');
        const errorMessage = document.getElementById('errorMessage');

        // Password Toggle Logic
        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.textContent = isPassword ? 'Hide' : 'Show';
        });

        const showError = (message) => {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign in';
        };

        // 5. Custom Database Login Logic
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Verifying credentials...';

            const email = document.getElementById('email').value.toLowerCase(); // Ensure lowercase matching
            const password = passwordInput.value;

            try {
                // Point directly to Collection: CreovateAi -> Document: Users
                const docRef = doc(db, "CreovateAi", "Users");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const allUsersData = docSnap.data();

                    // Check if the email exists as a field inside the document
                    if (allUsersData[email]) {
                        // Email found! Now check if the password matches
                        if (allUsersData[email].password === password) {
                            console.log("Login successful! Welcome,", allUsersData[email].name);
                            
                            // Optional: Save user data to localStorage so the dashboard knows who logged in
                            localStorage.setItem('currentUser', JSON.stringify({
                                email: email,
                                name: allUsersData[email].name
                            }));

                            window.location.href = 'dashboard.html'; 
                        } else {
                            showError("Incorrect password. Please try again.");
                        }
                    } else {
                        showError("No account found with this email.");
                    }
                } else {
                    showError("Database error: Users document not found.");
                }
            } catch (error) {
                console.error("Error reading database:", error);
                showError("Connection failed. Check your internet or Firebase config.");
            }
        });

        // Disable Google button since we aren't using Firebase Auth anymore
        googleBtn.addEventListener('click', () => {
            showError("Google Sign-in is disabled. Please use email and password.");
        });
    </script>
</body>
</html>
